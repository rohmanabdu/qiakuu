name: Update Rama
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Gabung Playlist
        run: python script/gabung.py
      - name: Push hasil
        run: |
          git config --global user.name "auto-bot"
          git config --global user.email "bot@github.com"
          git add derama/
          git diff --staged --quiet || git commit -m "update hasil"
          git push

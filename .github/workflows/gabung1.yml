name: Update hasil.m3u via cron-job.org
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Pull latest first (FIX ERROR REJECTED)
        run: |
          git pull --rebase origin main

      - name: Run script
        run: python gabung.py

      - name: Commit and Push
        run: |
          git config --global user.name "lian-bot"
          git config --global user.email "bot@lian"
          git add derama/hasil.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update hasil.m3u via cron-job.org"
          git push
